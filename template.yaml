AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Research automation Lambda scaffold.

Globals:
  Function:
    Runtime: python3.11
    Timeout: 60
    MemorySize: 256
    Architectures:
      - x86_64

Resources:
  IngestArticlesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: research_automation.handlers.ingest_articles.handler
      CodeUri: src/

  GenerateWeeklyDraftsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: research_automation.handlers.generate_weekly_drafts.handler
      CodeUri: src/

